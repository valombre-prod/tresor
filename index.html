<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chasse au Trésor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Creepster&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#150726; --bg2:#2a0f45; --surface:#3a1560; --accent:#ff7a18;
    --accent2:#7cf03d; --text:#ffe9d6; --muted:#b79ad0; --map:#e8d6a8; --mapink:#3a2a12;
    --display:'Fredoka', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Nunito', system-ui, -apple-system, sans-serif;
    color:var(--text);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--bg2), transparent 60%),
      var(--bg);
    min-height:100dvh;
    -webkit-text-size-adjust:100%;
    line-height:1.45;
  }
  #app{max-width:560px;margin:0 auto;padding:22px 18px 60px;min-height:100dvh}
  h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0}
  h1{font-size:clamp(30px,9vw,46px)}
  h2{font-size:clamp(22px,6vw,30px)}
  .title-spooky[data-theme="halloween"]{font-family:'Creepster',var(--display);letter-spacing:1px}
  p{margin:.5em 0}
  .muted{color:var(--muted)}
  button{font-family:inherit;cursor:pointer;border:none}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    background:var(--accent);color:#1a0b03;font-weight:800;font-size:17px;
    padding:15px 20px;border-radius:16px;width:100%;
    box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .06s, box-shadow .06s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
  .btn.secondary{background:var(--surface);color:var(--text);box-shadow:0 6px 0 rgba(0,0,0,.35)}
  .btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:700;font-size:15px;padding:10px}
  .btn.small{font-size:14px;padding:10px 14px;width:auto;border-radius:12px}
  .btn.accent2{background:var(--accent2);color:#0a2107}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1}
  .stack{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  label.field{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  label.field .hint{font-weight:600;color:var(--muted);font-size:12px;display:block;margin-top:2px}
  input,select,textarea{
    width:100%;font-family:inherit;font-size:16px;color:var(--text);
    background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.09);
    border-radius:12px;padding:12px 13px;
  }
  input:focus,select,textarea:focus{outline:none;border-color:var(--accent)}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px, calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat}
  textarea{resize:vertical;min-height:56px;line-height:1.4}
  .pill{display:inline-block;background:rgba(0,0,0,.25);color:var(--muted);font-weight:700;font-size:12px;padding:5px 11px;border-radius:999px}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .theme-chip{background:var(--surface);border:3px solid transparent;border-radius:16px;padding:14px 8px;text-align:center;color:var(--text);font-weight:700;font-size:13px}
  .theme-chip .emo{font-size:30px;display:block;margin-bottom:4px}
  .theme-chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
  .station{background:rgba(0,0,0,.18);border-radius:16px;padding:14px;margin-top:12px;border:1px solid rgba(255,255,255,.06)}
  .station h3{font-size:18px;display:flex;align-items:center;gap:8px}
  .num{background:var(--accent);color:#1a0b03;font-family:var(--display);font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none}
  .collapsed .station-body{display:none}
  .kicker{font-family:var(--display);color:var(--accent2);font-weight:600;font-size:15px}
  /* MAP */
  .map-wrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--map);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15), 0 10px 24px rgba(0,0,0,.3);touch-action:manipulation}
  .map-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .pins{position:absolute;inset:0}
  .pin{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:700;
    width:30px;height:30px;border-radius:50% 50% 50% 2px;background:var(--accent);color:#1a0b03;
    display:grid;place-items:center;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.7);cursor:pointer}
  .pin.target{background:var(--accent2);color:#0a2107;animation:bob 1s ease-in-out infinite}
  .pin.treasure{background:#f2c200;color:#3a2a00;border-radius:50%;border-color:#fff;font-size:14px}
  .pin.ghost{opacity:.35}
  @keyframes bob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-118%)}}
  .map-place-hint{font-size:13px;color:var(--mapink);position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.6);padding:3px 9px;border-radius:8px;font-weight:700}
  .stationbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .sbtn{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.25);color:var(--text);font-family:var(--display);font-weight:700;border:2px solid transparent}
  .sbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#1a0b03}
  .sbtn.placed{box-shadow:inset 0 0 0 2px var(--accent2)}
  /* PLAY */
  .screen{min-height:calc(100dvh - 40px);display:flex;flex-direction:column}
  .progress{height:10px;background:rgba(0,0,0,.3);border-radius:999px;overflow:hidden;margin:6px 0 18px}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
  .big-emoji{font-size:64px;text-align:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
  .ambiance{font-size:19px;line-height:1.5}
  .enigme{background:rgba(0,0,0,.25);border-left:4px solid var(--accent2);border-radius:0 14px 14px 0;padding:14px 16px;font-size:18px;font-style:italic}
  .box-cta{font-family:var(--display);font-size:22px;text-align:center;margin:8px 0}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .spacer{flex:1}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .confetti span{position:absolute;top:-20px;font-size:22px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
  .qr-box{background:#fff;padding:16px;border-radius:16px;display:grid;place-items:center;margin:0 auto;width:fit-content}
  .qr-box img,.qr-box canvas{display:block}
  .linkfield{font-size:12px;word-break:break-all;background:rgba(0,0,0,.3);padding:10px;border-radius:10px;color:var(--muted);max-height:70px;overflow:auto}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  a.link{color:var(--accent);font-weight:700}
  .divider{height:1px;background:rgba(255,255,255,.1);margin:20px 0}
  #print{display:none}
  @media print{
    body{background:#fff;color:#000}
    #app{display:none}
    #print{display:block;max-width:none;padding:0;color:#000;font-family:Nunito,sans-serif}
    .pcard{border:1.5px solid #000;border-radius:10px;padding:12px 14px;margin-bottom:12px;page-break-inside:avoid}
    .pcard h3{margin:0 0 6px;font-size:17px}
    .pcard .k{font-weight:800}
    .pmap{width:100%;max-width:420px;aspect-ratio:4/3;position:relative;border:1.5px solid #000;border-radius:8px;overflow:hidden}
    .pmap svg{position:absolute;inset:0;width:100%;height:100%}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>

<script>
/* ============================== DONNÉES : THÈMES ============================== */
const THEMES = {
  halloween:{

      {titre:"Les Vers de la Tombe",objet:"des nouilles froides ou des lacets de bonbon",histoire:"Ils grouillent, ils glissent, ils cherchent une main.",enigme:"Sans jambes je rampe, sans yeux je te trouve.",code:"POTION"},

      {titre:"La Poudre d'Os",objet:"de la farine ou de la semoule",histoire:"Tout ce qu'il reste des aventuriers trop curieux.",enigme:"Blanc comme neige mais né d'un squelette.",code:"OS"},

  pirate:{

    intro:"Ohé, moussaillons ! Le vieux Capitaine a caché son trésor et semé des épreuves sur toute l'île. Plongez la main dans les coffres du navire pour trouver les indices. En avant, toutes voiles dehors !",

      {titre:"Le Cordage du Navire",objet:"une corde ou de la laine épaisse",histoire:"Attention aux nœuds du gréement.",enigme:"Je tiens la voile et grimpe au mât.",code:"NOEUD"},

      {titre:"Les Cristaux de Lune",objet:"des glaçons ou du gros sel",histoire:"Récoltés sur la face cachée de la Lune.",enigme:"Froid et brillant, je viens du satellite blanc.",code:"LUNE"},
      {titre:"Les Circuits du Robot",objet:"des fils ou des trombones",histoire:"Le robot de bord a perdu quelques pièces.",enigme:"Sans moi, la fusée ne s'allume pas.",code:"ROBOT"},

      {titre:"Le Carburant Vert",objet:"du gel dans un sac fermé",histoire:"Le réservoir a fui dans la soute.",enigme:"Sans moi, pas de décollage vers les étoiles.",code:"FUSEE"}

    nom:"Jungle", emoji:"🌴",

    intro:"Explorateurs, bienvenue dans la jungle perdue ! Un temple ancien cache un trésor oublié. Pour percer ses secrets, il faudra plonger la main dans les paniers de l'expédition. Suivez la piste... mais attention aux bêtes !",

  feerie:{

    intro:"Bienvenue au Royaume Enchanté, petites fées et petits lutins ✨ Une magie ancienne a caché un trésor scintillant. Pour le retrouver, glissez la main dans les coffrets magiques et cueillez les indices. Que la magie vous guide !",

function trailSvg(stations, upTo){
  const pts = stations.map((s,i)=>({s,i})).filter(o=>o.s.pin && (upTo===undefined || o.i<=upTo));
  if(pts.length<2) return "";
  const p = pts.map(o=>`${o.s.pin.x} ${o.s.pin.y}`);
  const d = "M " + p.join(" L ");
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="1.1" stroke-dasharray="2.4 2" stroke-linecap="round"/></svg>`;
}

/* ============================== ENCODAGE / LIEN DE JEU ============================== */
function playConfig(){
  const orig=(THEMES[hunt.theme]||{}).boites||[];
  return {
    id:hunt.id, t:hunt.theme, e:hunt.enfant, a:hunt.age, tr:hunt.tresor, tl:hunt.tresorLieu||'', tp:hunt.tresorPin||null,
    s:hunt.stations.map(s=>{
      const li=(typeof s._lib==='number')?s._lib:-1, o=orig[li];
      const st={i:li, c:s.code||''};
      if(s.indiceLieu) st.l=s.indiceLieu;
      if(s.pin) st.p=s.pin;
      // on n'embarque le texte que s'il a été modifié (sinon on le reconstruit depuis la bibliothèque)
      if(!o || s.titre!==o.titre) st.t=s.titre;
      if(!o || s.histoire!==o.histoire) st.h=s.histoire;
      if(!o || s.enigme!==o.enigme) st.q=s.enigme;
      return st;
    })
  };
}
function encodeCfg(cfg){
  const j=JSON.stringify(cfg);
  if(window.LZString) return LZString.compressToEncodedURIComponent(j);
  return 'b'+btoa(unescape(encodeURIComponent(j)));
}
function decodeCfg(str){
  try{
    let j;
    if(str[0]==='b') j=decodeURIComponent(escape(atob(str.slice(1))));
    else j=LZString.decompressFromEncodedURIComponent(str);
    const c=JSON.parse(j);
    const orig=(THEMES[c.t]||{}).boites||[];
    return {id:c.id,theme:c.t,enfant:c.e,age:c.a,tresor:c.tr,tresorLieu:c.tl||'',tresorPin:c.tp||null,
      stations:c.s.map(s=>{
        const o=(typeof s.i==='number'&&s.i>=0)?orig[s.i]:null;
        return {
          titre: s.t!==undefined ? s.t : (o?o.titre:''),
          histoire: s.h!==undefined ? s.h : (o?o.histoire:''),
          enigme: s.q!==undefined ? s.q : (o?o.enigme:''),
          code: s.c||'', indiceLieu: s.l||'', pin: s.p||null
        };
      })};
  }catch(e){return null}
}
function playURL(){
  const base=location.href.split('#')[0];
  return base+'#j='+encodeCfg(playConfig());
}
// version "longue" (mêmes clés que decodeCfg) pour tester le jeu sans passer par l'encodage
function huntPlayCfg(){

}

function importHunt(file){
  const r=new FileReader();
  r.onload=()=>{try{const h=JSON.parse(r.result);if(h&&h.theme&&h.stations){hunt=h;activePin=0;save();render();toast('Chasse importée ✅')}else toast('Fichier invalide')}catch(e){toast('Fichier illisible')}};
  r.readAsText(file);
}

/* ---------- JEU ---------- */
function startPlay(cfg){
  play={cfg,step:-1,done:[]};
  // reprise éventuelle
  try{const r=localStorage.getItem('ct_play_'+cfg.id);if(r){const s=JSON.parse(r);play.step=s.step;play.done=s.done||[];play.tfound=s.tfound||false}}catch(e){}
  applyPalette(cfg.theme);view='play';render();
}
function savePlay(){try{localStorage.setItem('ct_play_'+play.cfg.id,JSON.stringify({step:play.step,done:play.done,tfound:play.tfound}))}catch(e){}}

function renderPlay(){
  const c=play.cfg,T=THEMES[c.theme];
  applyPalette(c.theme);
  // INTRO
  if(play.step<0){
    app().innerHTML=`<div class="screen stack">
      <div style="height:6vh"></div>
      <div class="big-emoji">${T.emoji}</div>
      <h1 class="title-spooky" data-theme="${c.theme}" style="text-align:center">${T.nom==='Halloween'?'La Nuit des Énigmes':'La Chasse au Trésor'}</h1>
      ${c.enfant?`<p class="muted" style="text-align:center;margin-top:-4px">Pour l'anniversaire de ${esc(c.enfant)} 🎉</p>`:''}
      <p class="ambiance card">${esc(T.intro)}</p>
      <div class="spacer"></div>
      <button class="btn" data-act="pstart">🚀 Commencer l'aventure</button>
    </div>`;return;
  }
  // FIN
  if(play.step>=c.stations.length){
    const hasLoc = c.tresorLieu || c.tresorPin;
    if(hasLoc && !play.tfound){
      app().innerHTML=`<div class="screen stack" style="text-align:center">
        <div style="height:4vh"></div>
        <div class="big-emoji">🗺️</div>
        <h2 class="title-spooky" data-theme="${c.theme}">Dernière énigme résolue !</h2>
        <p class="ambiance">Plus qu'à trouver le trésor... ${c.tresorLieu?`Il est caché <b>${esc(c.tresorLieu)}</b>.`:'Suis la carte, la coupe montre l\'endroit !'}</p>
        ${c.tresorPin?`<div class="map-wrap">${mapBg(c.theme)}${trailSvg(c.stations)}
          <div class="pins">${c.stations.map((st,k)=>st.pin?`<div class="pin ghost" style="left:${st.pin.x}%;top:${st.pin.y}%">${k+1}</div>`:'').join('')}<div class="pin treasure target" style="left:${c.tresorPin.x}%;top:${c.tresorPin.y}%">🏆</div></div></div>`:''}
        <div class="spacer"></div>
        <button class="btn" data-act="tfound">🏆 On a trouvé le trésor !</button>
      </div>`;return;
    }
    burst();
    app().innerHTML=`<div class="screen stack" style="text-align:center">
      <div style="height:8vh"></div>
      <div class="big-emoji" style="font-size:88px">🏆</div>
      <h1 class="title-spooky" data-theme="${c.theme}">Trésor trouvé !</h1>
      <p class="ambiance">Bravo ${esc(c.enfant)||'aventurier'} ! Vous avez réussi toutes les épreuves et découvert <b>${esc(c.tresor)}</b>.</p>
      <div class="spacer"></div>
      <button class="btn secondary" data-act="preplay">↻ Rejouer</button>
    </div>`;return;
  }
  // ÉPREUVE
  const i=play.step, s=c.stations[i];
  const petits=c.age==='petits', grands=c.age==='grands';
  const hasHint = s.pin || s.indiceLieu;
  app().innerHTML=`<div class="screen">
    <div class="row" style="align-items:center"><span class="pill" style="flex:none">Épreuve ${i+1} / ${c.stations.length}</span></div>
    <div class="progress"><i style="width:${(i)/c.stations.length*100}%"></i></div>
    <h2 class="title-spooky" data-theme="${c.theme}">${T.emoji} Boîte mystère n°${i+1}</h2>
    <p class="ambiance">${esc(s.histoire)}</p>
    <p class="box-cta">✋ Plonge la main dans la boîte...</p>
    <div class="enigme">${esc(s.enigme)}</div>

    ${hasHint?`<button class="btn ghost small" style="margin-top:12px" data-act="toggleHint">🗺️ Besoin d'un indice ?</button>
      <div id="hintbox" style="display:none">
        ${s.indiceLieu?`<p class="muted" style="text-align:center">La boîte est cachée <b>${esc(s.indiceLieu)}</b>.</p>`:''}
        ${s.pin?`<div class="map-wrap">${mapBg(c.theme)}${trailSvg(c.stations,i)}
          <div class="pins">${c.stations.map((st,k)=>st.pin?`<div class="pin ${k===i?'target':'ghost'}" style="left:${st.pin.x}%;top:${st.pin.y}%">${k+1}</div>`:'').join('')}</div></div>`:''}
      </div>`:''}

    <div class="spacer"></div>

    ${petits?`
      <p class="muted" style="text-align:center;font-size:13px">Trouvé le jeton dans la boîte ?</p>
      <button class="btn" data-act="found">✅ On l'a trouvé !</button>
      <details style="margin-top:8px"><summary class="muted" style="font-size:13px;text-align:center;list-style:none;cursor:pointer">🔒 entrer le code secret</summary>
        <div class="row" style="margin-top:8px"><input id="codein" placeholder="Le mot du jeton" autocapitalize="characters">
        <button class="btn small" style="flex:none" data-act="checkcode">OK</button></div></details>
    `:`
      <label class="field">Entre le code trouvé dans la boîte</label>
      <div class="row"><input id="codein" placeholder="Le mot caché dans la boîte" autocapitalize="characters" autocomplete="off">
      <button class="btn" style="flex:none;width:auto" data-act="checkcode">Valider</button></div>
      ${grands?'':'<button class="btn ghost small" data-act="found" style="margin-top:6px">Passer cette épreuve (parent)</button>'}
      ${grands?'<button class="btn ghost small" data-act="found" style="margin-top:6px">Passer (parent)</button>':''}
    `}
  </div>`;
  const inp=document.getElementById('codein');
  if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkCode()});
}
function nextStep(){play.done.push(play.step);play.step++;savePlay();render();window.scrollTo(0,0)}
function checkCode(){
  const inp=document.getElementById('codein');if(!inp)return;
  const s=play.cfg.stations[play.step];
  if(norm(inp.value)===norm(s.code)&&norm(s.code)!==''){toast('Bravo ! C\'était : '+s.titre+' 🎉');setTimeout(nextStep,350)}
  else{const scr=document.querySelector('.screen');scr&&scr.classList.add('shake');setTimeout(()=>scr&&scr.classList.remove('shake'),450);toast('Essaie encore 👻')}
}

/* ---------- effets ---------- */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
let _confirmCb=null;
function showConfirm(msg,cb){
  _confirmCb=cb;
  const m=document.createElement('div');m.id='confirmModal';m.className='card';
  m.style.cssText='position:fixed;left:14px;right:14px;bottom:14px;max-width:560px;margin:0 auto;z-index:40;box-shadow:0 -8px 40px rgba(0,0,0,.5)';
  m.innerHTML='<p style="font-weight:800;margin:0 0 12px">'+esc(msg)+'</p><div class="row"><button class="btn secondary" data-act="confirmNo">Annuler</button><button class="btn" data-act="confirmYes">Oui, effacer</button></div>';
  document.body.appendChild(m);
}
function burst(){
  const emo=['🎉','⭐','🏆','✨','🎈','🍬'];const c=document.createElement('div');c.className='confetti';
  for(let i=0;i<40;i++){const s=document.createElement('span');s.textContent=emo[i%emo.length];
    s.style.left=Math.random()*100+'%';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
}

/* ============================== ÉVÉNEMENTS ============================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act, i=+el.dataset.i;
  switch(act){
    case 'new': hunt=newHunt('halloween');activePin=0;save();view='admin';render();break;
    case 'resume': view='admin';render();break;
    case 'home': view='home';render();break;
    case 'theme':{const k=el.dataset.k;hunt.theme=k;if(!hunt.tresor||Object.values(THEMES).some(t=>t.tresor===hunt.tresor))hunt.tresor=THEMES[k].tresor;hunt.stations=[];save();render();break}
    case 'generate': if(!hunt.enfant){/*ok*/} generate(); if(hunt.stations[0])hunt.stations[0]._open=true; render();break;
    case 'toggle': hunt.stations[i]._open=!hunt.stations[i]._open;render();break;
    case 'pickpin': activePin=i;render();break;
    case 'picktreasure': activePin='T';render();break;
    case 'placeThis': activePin=i;render();setTimeout(()=>document.querySelector('.map-wrap')?.scrollIntoView({behavior:'smooth',block:'center'}),50);break;
    case 'mapclick':{
      const wrap=el;const r=wrap.getBoundingClientRect();
      const x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));
      const y=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100));
      if(activePin==='T'){hunt.tresorPin={x:+x.toFixed(1),y:+y.toFixed(1)};save();render()}
      else if(hunt.stations[activePin]){hunt.stations[activePin].pin={x:+x.toFixed(1),y:+y.toFixed(1)};
        if(activePin<hunt.stations.length-1)activePin++;save();render()}
      break;}
    case 'qr': showQR();break;
    case 'closeqr': e.target.closest('.card').remove();break;
    case 'copylink': navigator.clipboard?.writeText(el.dataset.url).then(()=>toast('Lien copié 📋'),()=>toast('Copie impossible'));break;
    case 'print': doPrint();break;
    case 'export': exportHunt();break;
    case 'import': document.getElementById('importFile').click();break;
    case 'testplay': startPlay(huntPlayCfg());break;
    case 'reset': showConfirm('Effacer toute la chasse ? (impossible à annuler)',()=>{hunt=null;try{localStorage.removeItem(LS)}catch(e){}view='home';render();toast('Chasse effacée 🗑️')});break;
    case 'confirmYes':{const m=document.getElementById('confirmModal');if(m)m.remove();const cb=_confirmCb;_confirmCb=null;if(cb)cb();break}
    case 'confirmNo':{const m=document.getElementById('confirmModal');if(m)m.remove();_confirmCb=null;break}
    // JEU
    case 'pstart': play.step=0;savePlay();render();window.scrollTo(0,0);break;
    case 'found': nextStep();break;
    case 'checkcode': checkCode();break;
    case 'toggleHint':{const h=document.getElementById('hintbox');if(h)h.style.display=h.style.display==='none'?'block':'none';break}
    case 'preplay': play.step=-1;play.done=[];play.tfound=false;savePlay();render();break;
    case 'tfound': play.tfound=true;savePlay();render();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-f]');if(!el||!hunt)return;
  const f=el.dataset.f, i=el.dataset.i;
  if(i!==undefined){hunt.stations[+i][f]=el.value}
  else{hunt[f]= (f==='nb')?+el.value:el.value}
  save();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='importFile'&&el.files[0]){importHunt(el.files[0]);return}
  const fe=el.closest('[data-f]');
  if(fe&&(fe.dataset.f==='theme'||fe.dataset.f==='nb'||fe.dataset.f==='age')){/* selects re-render via input already saved */ render()}
});

/* ============================== BOOT ============================== */
function boot(){
  let payload=null;
  const h=location.hash;
  if(h.startsWith('#j=')) payload=h.slice(3);
  else { const m=location.search.match(/[?&]j=([^&]+)/); if(m) payload=decodeURIComponent(m[1]); }
  if(payload){
    const cfg=decodeCfg(payload);
    if(cfg){startPlay(cfg);return}
  }
  hunt=load();
  view='home';render();
}
// laisse les libs cdnjs se charger si possible
window.addEventListener('load',boot);
</script>
</body>
</html>
